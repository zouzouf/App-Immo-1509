name: Scrape Annonces Immobilières Angers

on:
  schedule:
    - cron: '0 6 * * *' # Tous les jours à 8h (heure française)
  workflow_dispatch:

jobs:
  scrape_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          playwright install chromium

      - name: Run Scraper with Playwright
        run: python scraper.py

      - name: Commit and push updated json
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add annonces.json
          git commit -m "Mise à jour automatique des annonces [skip ci]" || exit 0
          git push
